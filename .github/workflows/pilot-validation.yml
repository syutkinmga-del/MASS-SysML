name: SysML v2 Pilot validation

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate with SysML v2 Pilot 2026-07
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Initialize validation log
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/pilot-validation"
          : > "$RUNNER_TEMP/pilot-validation/pilot-validation.log"

      - name: Install pinned Python dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check \
            "jupyter_client==8.10.0" \
            "jupyter_core==5.9.1" \
            "pyzmq==27.2.0" \
            "traitlets==5.16.1" \
            "tornado==6.5.8" \
            "platformdirs==4.11.7" \
            "python-dateutil==2.9.0.post0" \
            "six==1.17.0" \
            2>&1 | tee -a "$RUNNER_TEMP/pilot-validation/pilot-validation.log"

      - name: Download and verify Pilot 2026-07
        shell: bash
        run: |
          set -euo pipefail
          {
            archive="$RUNNER_TEMP/jupyter-sysml-kernel-0.61.0.zip"
            install_dir="$RUNNER_TEMP/pilot-dist"
            curl --fail --location --retry 3 --show-error \
              --output "$archive" \
              https://github.com/Systems-Modeling/SysML-v2-Pilot-Implementation/releases/download/2026-07/jupyter-sysml-kernel-0.61.0.zip
            echo '3d310efb8a5332b11ec2441697d40ae10e7e04cfb8c8d121c198ffba38229ada  '"$archive" \
              | sha256sum --check -
            mkdir -p "$install_dir"
            unzip -q "$archive" -d "$install_dir"
            test -f "$install_dir/install.py"
            test -f "$install_dir/sysml/kernel.json"
            jar="$install_dir/sysml/jupyter-sysml-kernel-0.61.0-all.jar"
            test -f "$jar"
            echo '602b53fa64d5af84480aa00e06e590a140d7d5c3651d4d76ac0e0055f89f0079  '"$jar" \
              | sha256sum --check -
            echo "Verified Pilot release: 2026-07 / 0.61.0"
            echo "Verified kernel JAR: $jar"
            sha256sum "$jar"
          } 2>&1 | tee -a "$RUNNER_TEMP/pilot-validation/pilot-validation.log"

      - name: Install kernel into CI Python prefix
        shell: bash
        run: |
          set -euo pipefail
          python "$RUNNER_TEMP/pilot-dist/install.py" --sys-prefix \
            2>&1 | tee -a "$RUNNER_TEMP/pilot-validation/pilot-validation.log"
          python -c 'import json; from jupyter_client.kernelspec import KernelSpecManager; specs = KernelSpecManager().find_kernel_specs(); assert "sysml" in specs, specs; print(json.dumps(specs, sort_keys=True))' \
            2>&1 | tee -a "$RUNNER_TEMP/pilot-validation/pilot-validation.log"

      - name: Check smoke model and MASSKernel files
        shell: bash
        run: |
          set -euo pipefail
          python scripts/check_pilot.py --kernel sysml \
            2>&1 | tee -a "$RUNNER_TEMP/pilot-validation/pilot-validation.log"

      - name: Upload validation log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pilot-validation-log
          path: ${{ runner.temp }}/pilot-validation/pilot-validation.log
          if-no-files-found: warn
